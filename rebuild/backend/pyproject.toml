[project]
name = "resumeai"
version = "0.0.1"
description = "ResumeAI API (Phase 0 scaffold)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "email-validator>=2.0",
  "pydantic[email]>=2.0",
  "requests>=2.31",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Prefer project-root pytest.ini when running from workspace root
pythonpath = ["."]
